name: task-5 build and publish
on:
  push:
    branches: [main]
    paths: ["task-5/**", ".github/workflows/deploy-task5.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/shorteditor/cloud-notes-api
jobs:
  staging-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-5
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t notes-api:staging .
      - name: Run container (staging)
        run: docker run -d --name staging -p 8080:8080 -e APP_VERSION=${{ github.sha }} notes-api:staging
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs localhost:8080/health
          curl -fs -X POST localhost:8080/notes -H 'content-type: application/json' -d '{"title":"smoke"}'
          curl -fs "localhost:8080/notes?q=smoke" | grep '"total":1'
          curl -fsI localhost:8080/health | grep -i 'x-content-type-options: nosniff'
      - name: Logs
        if: always()
        run: docker logs staging
  publish-production-image:
    needs: staging-smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: task-5
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
